; *****************************************************************************************
;
;	SOUND CONFIGURATION FILE
;
;
; *****************************************************************************************
;
;	FILENAME      = Sound file to load using .WAV as default or .MCW for internal format
;	DESCRIPTION   = Sound description, indicate if sound is integrated
;	USE_LOOP      = BOOL    - DEFAULT 0   : Indicate that sound will be playing using loop
;	USE_VOLUME    = BOOL    - DEFAULT 0   : User can modify sound volume
;	USE_PAN       = BOOL    - DEFAULT 0   : User can use stereo effects
;	USE_SURROUND  = BOOL    - DEFAULT 0   : User can use 3D effects
;	USE_FREQUENCY = BOOL    - DEFAULT 0   : User can modify frequency
;	USE_STREAMING = BOOL    - MUST BE 0   : Sound is played using streaming instead of static buffers
;	START_VOLUME  = PERCENT - DEFAULT 100 : Sound start volume (USE_VOLUME MUST BE SET TO 1)
;
; *****************************************************************************************

; *********************************************************
;
;	CHAT
;
; *********************************************************

